<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제안 접수</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root{--ink:#1A2230;--muted:#5B6678;--line:#E6E9EF;--bg:#EEF3FB;--blue:#4F46E5;--green:#15803D}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:0 0 60px}
  .top{background:var(--blue);color:#fff;padding:18px clamp(16px,4vw,24px);font-size:20px;font-weight:800}
  .wrap{max-width:560px;margin:0 auto;padding:16px clamp(12px,3vw,18px)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(20,30,50,.04)}
  .q{font-size:16px;font-weight:800;margin-bottom:10px}
  .q .opt{font-size:13px;color:var(--muted);font-weight:600}
  input[type=text],textarea{width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;font-size:16px;font-family:inherit;padding:8px 2px;outline:none;color:var(--ink)}
  input[type=text]:focus,textarea:focus{border-bottom-color:var(--blue)}
  textarea{resize:vertical;line-height:1.5;min-height:70px;border:1.5px solid var(--line);border-radius:10px;padding:10px}
  .radios{display:flex;flex-direction:column;gap:12px}
  .radio{display:flex;align-items:center;gap:10px;font-size:16px;cursor:pointer}
  .radio input{width:20px;height:20px;accent-color:var(--blue)}
  .photo-box{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .photo-box img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .addphoto{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border:1.5px dashed var(--blue);border-radius:10px;color:var(--blue);font-size:13px;font-weight:700;cursor:pointer;text-align:center;line-height:1.2}
  .submit{width:100%;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:18px;font-size:18px;font-weight:800;cursor:pointer;margin-top:6px}
  .submit:disabled{opacity:.5}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
  <div class="top">📝 나의 제안</div>
  <div class="wrap">
    <div class="card">
      <div class="q">부서명 <span class="opt">(생략 가능)</span></div>
      <input type="text" id="team" placeholder="예: 생산팀">
    </div>
    <div class="card">
      <div class="q">성명 <span class="opt">(생략 가능)</span></div>
      <input type="text" id="proposer" placeholder="이름">
    </div>
    <div class="card">
      <div class="q">제안 구분</div>
      <div class="radios">
        <label class="radio"><input type="radio" name="ptype" value="개인"> 개인</label>
        <label class="radio"><input type="radio" name="ptype" value="공공"> 공공</label>
        <label class="radio"><input type="radio" name="ptype" value="분임조"> 분임조</label>
      </div>
    </div>
    <div class="card">
      <div class="q">제안 내용</div>
      <textarea id="content" placeholder="어떤 제안인지 적어주세요"></textarea>
    </div>
    <div class="card">
      <div class="q">현재 문제점</div>
      <textarea id="problem" placeholder="현재 무엇이 불편하거나 위험한가요?"></textarea>
    </div>
    <div class="card">
      <div class="q">개선 방안</div>
      <textarea id="improve" placeholder="어떻게 개선하면 좋을지 적어주세요"></textarea>
    </div>
    <div class="card">
      <div class="q">사진 첨부 <span class="opt">(선택)</span></div>
      <div class="photo-box" id="photoBox">
        <label class="addphoto">＋ 사진<input type="file" id="photoInput" accept="image/*" multiple hidden></label>
      </div>
      <div class="hint">현장 사진을 함께 올리면 검토에 도움이 됩니다.</div>
    </div>
    <button class="submit" id="submitBtn">제안 제출하기</button>
    <div class="hint" style="text-align:center;margin-top:12px">제출하면 안전환경지원팀에서 검토 후 진행합니다.</div>
  </div>

<script type="module">
import { db, ref, get, set, storage, sRef, uploadBytes, getDownloadURL } from "./firebase-setup.js";

let files = []; // {file, url(objectURL)}
const $ = s => document.querySelector(s);

$("#photoInput").onchange = e => {
  for (const f of e.target.files) files.push({ file: f, url: URL.createObjectURL(f) });
  e.target.value = "";
  renderPhotos();
};
function renderPhotos() {
  const box = $("#photoBox");
  box.querySelectorAll(".thumb").forEach(x => x.remove());
  files.forEach((f, i) => {
    const img = document.createElement("img");
    img.src = f.url; img.className = "thumb"; img.title = "탭하면 제거";
    img.onclick = () => { files.splice(i, 1); renderPhotos(); };
    box.insertBefore(img, box.querySelector(".addphoto"));
  });
}

function todayStr() { const d = new Date(); const yy = String(d.getFullYear() % 100).padStart(2, "0"); return yy + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0"); }

$("#submitBtn").onclick = async () => {
  const team = $("#team").value.trim();
  const proposer = $("#proposer").value.trim();
  const ptype = (document.querySelector('input[name="ptype"]:checked') || {}).value || "";
  const content = $("#content").value.trim();
  const problem = $("#problem").value.trim();
  const improve = $("#improve").value.trim();
  if (!content && !problem && !improve) return Swal.fire("알림", "제안 내용을 하나 이상 입력해 주세요.", "warning");

  const btn = $("#submitBtn"); btn.disabled = true; btn.textContent = "제출 중…";
  try {
    // 다음 관리번호
    const snap = await get(ref(db, "proposals"));
    const d = snap.val() || {};
    const maxNo = Object.values(d).reduce((m, s) => Math.max(m, s.no || 0), 0);
    const no = maxNo + 1;
    const mgmtNo = "BW-2026-" + String(no).padStart(3, "0");

    // 사진 업로드
    const photos = [];
    for (const f of files) {
      const r = sRef(storage, "proposalPhotos/" + mgmtNo + "/" + Date.now() + "_" + f.file.name);
      await uploadBytes(r, f.file);
      photos.push({ url: await getDownloadURL(r), kind: "before" });
    }

    const title = (content || problem || improve).split("\n")[0].slice(0, 40) || "(제목 없음)";
    const body = [
      content ? "① 제안 내용\n" + content : "",
      problem ? "② 현재 문제점\n" + problem : "",
      improve ? "③ 개선 방안\n" + improve : ""
    ].filter(Boolean).join("\n\n");

    const rec = {
      no, year: 2026, month: new Date().getMonth() + 1, mgmtNo, team, proposer, ptype,
      category: "제안",
      title, content: body,
      review: "", action: "", done: "", followup: todayStr() + " 접수",
      raw: { content, problem, improve },   // 원문 보관(추후 AI 정리에 사용)
      source: "qr", submittedAt: Date.now()
    };
    if (photos.length) rec.photos = photos;
    await set(ref(db, "proposals/" + mgmtNo), rec);

    await Swal.fire("접수 완료!", "소중한 제안 감사합니다. 검토 후 진행하겠습니다.", "success");
    location.reload();
  } catch (e) {
    console.error(e);
    Swal.fire("오류", "제출 중 문제가 발생했습니다. 다시 시도해 주세요.", "error");
    btn.disabled = false; btn.textContent = "제안 제출하기";
  }
};
</script>
</body>
</html>
