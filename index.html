<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세이프 미 (Safe me)</title>
  <style>
    body { text-align: center; background-color: #e6f7ff; font-family: sans-serif; padding-top: 10px; font-size: 20px; margin: 0; }
    #noticeBanner { background-color: #ff5252; color: white; padding: 15px; font-size: 22px; font-weight: bold; display: none; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); text-align: center; word-break: keep-all; }
    h1 { font-size: 36px; color: #333; margin-bottom: 20px; margin-top: 30px; }
    .btn { display: block; margin: 15px auto; padding: 25px; font-size: 24px; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; color: white; width: 90%; max-width: 450px; }
    .qr-btn { background-color: #2196F3; } 
    .user-btn { background-color: #4CAF50; } 
    .msg-btn { background-color: #9c27b0; } 
    /* ⭐ 임시 목록(투표) 버튼 스타일 ⭐ */
    .vote-btn { background-color: #ff9800; display: none; } 
    .secret-gear { position: absolute; top: 15px; right: 15px; font-size: 30px; background: none; border: none; cursor: pointer; }
    /* 제안 현황 대시보드 (인라인, 시스템 폰트) */
    #pboard{max-width:480px;margin:26px auto 0;text-align:left;font-size:16px}
    #pboard .p-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 4px}
    #pboard h2{font-size:22px;font-weight:800;margin:0 0 2px;color:#333}
    #pboard .p-sub{color:#5B6678;font-size:13px}
    #pboard .p-edit{flex:0 0 auto;font-size:13px;font-weight:800;color:#fff;background:#2563EB;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap;margin-top:3px}
    #pboard .p-tabs{display:flex;gap:8px;margin:14px 0}
    #pboard .p-tab{flex:1;background:#fff;border:1.5px solid #E6E9EF;border-radius:12px;padding:12px 6px;cursor:pointer;text-align:center}
    #pboard .p-tab .n{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
    #pboard .p-tab .l{font-size:12px;color:#5B6678;font-weight:700;margin-top:4px}
    #pboard .p-tab.on{border-color:#D97706;box-shadow:0 0 0 3px rgba(217,119,6,.12)}#pboard .p-tab.on .n{color:#D97706}
    #pboard .p-tab.wan.on{border-color:#15803D;box-shadow:0 0 0 3px rgba(21,128,61,.12)}#pboard .p-tab.wan.on .n{color:#15803D}
    #pboard .p-tab.bor.on{border-color:#6B7280;box-shadow:0 0 0 3px rgba(107,114,128,.14)}#pboard .p-tab.bor.on .n{color:#6B7280}
    #pboard .p-search{width:100%;border:1.5px solid #E6E9EF;border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;box-sizing:border-box}
    #pboard .p-card{position:relative;background:#fff;border:1px solid #E6E9EF;border-radius:12px;margin-bottom:8px;overflow:hidden}
    #pboard .p-head{display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer}
    #pboard .p-id{font-size:12px;font-weight:800;color:#5B6678;white-space:nowrap}
    #pboard .p-ttl{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #pboard .p-team{font-size:12px;color:#5B6678;white-space:nowrap}
    #pboard .p-badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
    #pboard .b-jin{color:#D97706;background:#FDF3E3}#pboard .b-wan{color:#15803D;background:#DCFCE7}#pboard .b-bor{color:#6B7280;background:#EEF0F3}
    #pboard .p-detail{display:none;border-top:1px solid #E6E9EF;padding:14px;background:#FAFBFD}
    #pboard .p-card.open .p-detail{display:block}
    #pboard .p-detail h4{font-size:12px;font-weight:800;color:#5B6678;margin:0 0 6px}
    #pboard .p-content{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-bottom:14px}
    #pboard .p-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    #pboard .p-chip{font-size:12px;background:#fff;border:1px solid #E6E9EF;border-radius:8px;padding:6px 9px}
    #pboard .p-follow{white-space:pre-wrap;font-size:13px;line-height:1.6;background:#fff;border:1px solid #E6E9EF;border-radius:10px;padding:11px;color:#374151}
    #pboard .p-empty{text-align:center;color:#5B6678;padding:30px 0;font-size:14px}
    #pboard .p-new{position:absolute;top:12px;left:-32px;width:112px;transform:rotate(-45deg);background:linear-gradient(180deg,#FFE066,#EAB308);color:#5A4200;font-size:10px;font-weight:900;letter-spacing:.1em;text-align:center;padding:3px 0;box-shadow:0 2px 4px rgba(0,0,0,.25);z-index:3}
    #pboard .p-card.isnew .p-head{padding-left:40px}
    #pboard .ttl-more{flex:0 0 auto;border:0;background:#EEF0F5;color:#5B6678;font-weight:800;border-radius:6px;padding:1px 7px;cursor:pointer;font-size:13px;line-height:1.5}
    #pboard .p-card.ttl-open .p-ttl{white-space:normal;overflow:visible;text-overflow:clip}
    #pboard .p-card.isnew{border-color:#EBCB6B;box-shadow:0 0 0 1px #EBCB6B}
    #pboard .p-cc{font-size:11px;color:#2563EB;font-weight:800;white-space:nowrap}
    #pboard .p-detail h4{margin-top:14px}
    #pboard .pcm-list{margin-bottom:10px}
    #pboard .pcm-empty{color:#9aa3b2;font-size:13px;padding:2px 0}
    #pboard .pcm-item{border-top:1px solid #EEF0F5;padding:8px 0}
    #pboard .pcm-item:first-child{border-top:0}
    #pboard .pcm-nm{font-weight:800;font-size:13px;margin-right:8px}
    #pboard .pcm-tm{font-size:11px;color:#9aa3b2}
    #pboard .pcm-tx{font-size:14px;margin-top:3px;white-space:pre-wrap;line-height:1.45}
    #pboard .pcm-form{display:flex;gap:6px;flex-wrap:wrap}
    #pboard .pcm-name{flex:0 0 92px;border:1px solid #E6E9EF;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;outline:none}
    #pboard .pcm-text{flex:1;min-width:120px;border:1px solid #E6E9EF;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;outline:none}
    #pboard .pcm-send{flex:0 0 auto;background:#2563EB;color:#fff;border:0;border-radius:8px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer}
    #pboard .pcm-send:disabled{opacity:.5}
    #pboard .p-tab.settab{flex:0 0 auto;padding:8px 12px}
    #pboard .p-tab.settab .n{font-size:18px}
    #pboard .p-photos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
    #pboard .p-photo{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid #E6E9EF;cursor:pointer}
    #pboard .ef{background:#F1F5FF;border:1px solid #C7D7FE;border-radius:10px;padding:12px;margin-top:6px}
    #pboard .ef label{display:block;font-size:12px;color:#334;font-weight:700;margin-bottom:10px}
    #pboard .ef-row{display:flex;gap:8px;flex-wrap:wrap}
    #pboard .ef-row label{flex:1;min-width:100px}
    #pboard .ef select,#pboard .ef textarea{width:100%;border:1.5px solid #C7D7FE;border-radius:8px;padding:8px;font-size:14px;font-family:inherit;margin-top:4px;outline:none}
    #pboard .ef-photos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
    #pboard .ef-ph{position:relative;display:inline-block}
    #pboard .ef-ph img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #C7D7FE}
    #pboard .ef-ph-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#EF4444;color:#fff;font-weight:800;cursor:pointer;line-height:1}
    #pboard .ef-actions{display:flex;gap:8px;align-items:center}
    #pboard .ef-up{background:#fff;border:1.5px solid #2563EB;color:#2563EB;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;margin:0!important}
    #pboard .ef-save{background:#15803D;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer}
    #pboard .ef-save:disabled{opacity:.5}
    #pboard .p-card.editing{border-color:#93B4FE}
    #pboard .ef-note{font-size:12px;color:#5B6678;margin:8px 0}
    #pboard .p-dday{font-size:11px;font-weight:800;color:#B45309;background:#FEF3C7;padding:2px 8px;border-radius:999px;white-space:nowrap}
    #pboard .p-dday.over{color:#991B1B;background:#FEE2E2}
    #pboard .p-dday.txt.orange{color:#fff;background:#F59E0B}
    #pboard .p-dday.txt.red{color:#fff;background:#EF4444}
    #pboard .pg{margin-bottom:8px}
    #pboard .pg-l{font-size:12px;font-weight:800;color:#5B6678;margin-bottom:4px}
    #pboard .fu-add{display:flex;gap:6px;margin-top:8px}
    #pboard .fu-date{flex:0 0 72px;border:1.5px solid #C7D7FE;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;outline:none}
    #pboard .fu-text{flex:1;min-width:80px;border:1.5px solid #C7D7FE;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;outline:none}
    #pboard .fu-btn{flex:0 0 auto;background:#2563EB;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer}
    #pboard .fu-btn:disabled{opacity:.5}
    #pboard .fu-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
    #pboard .fu-item{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;background:#fff;border:1px solid #E6E9EF;border-radius:8px;padding:7px 10px;font-size:13.5px;line-height:1.45}
    #pboard .fu-item span{white-space:pre-wrap;word-break:break-word}
    #pboard .fu-del{flex:0 0 auto;border:0;background:#FEE2E2;color:#B91C1C;font-weight:800;border-radius:6px;padding:1px 8px;cursor:pointer;line-height:1.4}
    #pboard .fu-empty{color:#9aa3b2;font-size:13px;padding:2px 0}
    #pboard .p-editbtn{background:#2563EB;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
    #pboard .ef-cancel{background:#fff;border:1px solid #E6E9EF;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <div id="noticeBanner">📢 불러오는 중...</div>
  <button class="secret-gear" onclick="var p=prompt('관리자 암호?'); if(p==='1234') location.href='admin.html';">⚙️</button>
  
  <h1>🌟 세이프 미 (Safe me) 🌟</h1>
  
  <button class="btn qr-btn" onclick="location.href='qr.html'">📝 일일 안전미션</button>
  <button class="btn user-btn" onclick="location.href='user.html'">👷‍♂️ 내 상태 확인</button>
  
  <button id="voteBtn" class="btn vote-btn" onclick="location.href='vote.html'"></button>
  
  <button class="btn msg-btn" onclick="location.href='message.html'">✉️ 1:1 건의함 (쪽지)</button>

  <!-- 제안 현황 대시보드 (인라인, 항상 표시) -->
  <section id="pboard">
    <div class="p-h">
      <div><h2>제안 현황</h2><div class="p-sub">2026년 반월공장 제안 · 조치현황 (실시간)</div></div>
      <button class="p-edit" id="pEdit" title="현재 화면에서 수정 (비밀번호 0000)">✏️ 수정</button>
    </div>
    <div class="p-tabs">
      <div class="p-tab on" data-s="진행중"><div class="n" id="pc-jin">0</div><div class="l">진행중</div></div>
      <div class="p-tab wan" data-s="완료"><div class="n" id="pc-wan">0</div><div class="l">완료</div></div>
      <div class="p-tab bor" data-s="미시행"><div class="n" id="pc-mis">0</div><div class="l">미시행</div></div>
      <div class="p-tab settab" data-s="제안설정"><div class="n">⚙️</div><div class="l">제안설정</div></div>
    </div>
    <input class="p-search" id="pSearch" placeholder="관리번호·소속·내용 검색">
    <div id="pList"><div class="p-empty">불러오는 중…</div></div>
  </section>

  <section id="suggestionBoard" style="display:none; margin-top:30px; padding-bottom:30px;"></section>

  <script type="module">
    import { db, ref, onValue, get, push, set } from "./firebase-setup.js";

    // 💡 제안 현황 대시보드 (proposals) — index의 단일 Firebase 연결 재사용
    let P = [], pTab = "진행중", unlocked = false;
    const pq = s => document.querySelector(s);
    const pEsc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const pSt = s => { const d = (s.done || "").trim(); if ((s.action || "").includes("미시행")) return "미시행"; if (d === "완료") return "완료"; if (d === "미완료") return "진행중"; return "제안접수"; };
    const pBadge = st => st === "완료" ? "b-wan" : st === "미진행" ? "b-bor" : "b-jin";
    const pNew = s => { const today = new Date(); today.setHours(0, 0, 0, 0); return (String(s.followup || "").match(/\d{2}\.\d{2}\.\d{2}|\d{6}/g) || []).some(t => { const p = t.includes(".") ? t.split(".") : [t.slice(0, 2), t.slice(2, 4), t.slice(4, 6)]; const mo = +p[1]; if (mo < 1 || mo > 12) return false; const d = new Date(2000 + +p[0], mo - 1, +p[2]); d.setHours(0, 0, 0, 0); const diff = (today - d) / 86400000; return diff >= 0 && diff <= 7; }); };
    const ckey = m => String(m).replace(/[.#$/\[\]]/g, "-");
    const OPT_REVIEW = ["", "보류", "참가", "노력", "본사 제출"], OPT_ACTION = ["", "시행", "검토후 시행", "미시행"], OPT_DONE = ["", "미완료", "완료"];
    const optHtml = (opts, val) => opts.map(o => `<option value="${pEsc(o)}"${(val || "") === o ? " selected" : ""}>${o === "" ? "(선택)" : o}</option>`).join("");
    let COMMENTS = {}, openKeys = new Set();
    onValue(ref(db, "proposals"), snap => {
      const d = snap.val() || {};
      P = Object.entries(d).map(([k, v]) => ({ ...v, _key: k })).sort((a, b) => (a.no || 0) - (b.no || 0));
      const c = { 진행중: 0, 완료: 0, 미시행: 0, 제안접수: 0 }; P.forEach(s => c[pSt(s)]++);
      pq("#pc-jin").textContent = c.진행중; pq("#pc-wan").textContent = c.완료; if (pq("#pc-mis")) pq("#pc-mis").textContent = c.미시행;
      pRender();
    });
    onValue(ref(db, "pcomments"), snap => { COMMENTS = snap.val() || {}; pRender(); });
    const normPh = p => typeof p === "string" ? { url: p, kind: "before" } : p;
    function photoGroups(s) {
      const ph = (s.photos || []).map(normPh); if (!ph.length) return "";
      const grp = (kind, label) => { const a = ph.filter(p => (p.kind || "before") === kind); return a.length ? `<div class="pg"><div class="pg-l">${label}</div><div class="p-photos">${a.map(p => `<img class="p-photo" src="${pEsc(p.url)}" loading="lazy">`).join("")}</div></div>` : ""; };
      return `<h4>사진</h4>${grp("before", "조치 전")}${grp("after", "조치 후")}`;
    }
    function targetMD(line) {
      const yy = new Date().getFullYear() % 100, cands = []; let m;
      const reQ = /([1-4])\s*분기/g; while ((m = reQ.exec(line))) cands.push({ mo: [3, 6, 9, 12][+m[1] - 1], dd: [31, 30, 30, 31][+m[1] - 1], pos: m.index });
      const reM = /(\d{1,2})\s*월/g; while ((m = reM.exec(line))) { const mo = +m[1]; if (mo >= 1 && mo <= 12) cands.push({ mo, dd: new Date(2000 + yy, mo, 0).getDate(), pos: m.index }); }
      if (!cands.length) return null;
      const impl = [...line.matchAll(/시행|진행|설치|완료|예정|교체|보완/g)].map(x => x.index);
      let best = null; for (const c of cands) for (const ip of impl) if (ip >= c.pos) { const g = ip - c.pos; if (!best || g < best.g) best = { c, g }; }
      return best ? best.c : cands[cands.length - 1];
    }
    function ddayOf(s) {
      const fu = (s.followup || "").trim(); if (!fu) return null;
      const last = fu.split("\n").map(x => x.trim()).filter(Boolean).pop() || "";
      const md = targetMD(last), yy = new Date().getFullYear() % 100;
      if (md) {
        const target = String(yy).padStart(2, "0") + "." + String(md.mo).padStart(2, "0") + "." + String(md.dd).padStart(2, "0");
        const tgt = new Date(2000 + yy, md.mo - 1, md.dd), today = new Date(); today.setHours(0, 0, 0, 0);
        return { kind: "date", target, days: Math.round((tgt - today) / 86400000) };
      }
      const raw = last.replace(/^(\d{2}\.\d{2}\.\d{2}|\d{6})\s*/, "").trim(); if (!raw) return null;
      const tui = /추후/.test(raw); return { kind: "text", label: tui ? "추후 진행" : "날짜 미선정", tone: tui ? "orange" : "red" };
    }
    const fmtDate = v => { v = (v || "").trim(); if (/^\d{2}\.\d{2}\.\d{2}$/.test(v)) return v; if (/^\d{6}$/.test(v)) return v.slice(0, 2) + "." + v.slice(2, 4) + "." + v.slice(4, 6); const m = v.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})$/); if (!m) return null; const yy = String(new Date().getFullYear() % 100).padStart(2, "0"); return yy + "." + String(+m[1]).padStart(2, "0") + "." + String(+m[2]).padStart(2, "0"); };
    function pRender() {
      const q = (pq("#pSearch").value || "").replace(/\s+/g, "").toLowerCase();
      let rows = P.filter(s => pSt(s) === pTab);
      if (q) rows = rows.filter(s => ((s.mgmtNo || "") + (s.team || "") + (s.title || "") + (s.content || "")).replace(/\s+/g, "").toLowerCase().includes(q));
      const box = pq("#pList");
      if (!rows.length) { box.innerHTML = '<div class="p-empty">' + (P.length ? "해당하는 제안이 없습니다." : "등록된 제안이 없습니다.") + '</div>'; return; }
      box.innerHTML = rows.map(s => { const st = pSt(s), nw = pNew(s), k = s._key;
        const cents = Object.entries(COMMENTS[k] || {}).sort((a, b) => a[0] < b[0] ? -1 : 1), cc = cents.length;
        const clist = cc ? cents.map(([, c]) => `<div class="pcm-item"><span class="pcm-nm">${pEsc(c.name)}</span><span class="pcm-tm">${pEsc(c.time)}</span><div class="pcm-tx">${pEsc(c.text)}</div></div>`).join("") : '<div class="pcm-empty">첫 댓글을 남겨보세요. (실명 입력)</div>';
        const dd = (st === "완료" || st === "미시행") ? null : ddayOf(s), ddBadge = dd ? (dd.kind === "date" ? `<span class="p-dday${dd.days < 0 ? ' over' : ''}">${dd.days >= 0 ? "D-" + dd.days : "D+" + (-dd.days)}</span>` : `<span class="p-dday txt ${dd.tone}">${pEsc(dd.label)}</span>`) : "";
        const body = unlocked ? `<div class="ef">
            <div class="ef-row">
              <label>심사결과<select data-f="review">${optHtml(OPT_REVIEW, s.review)}</select></label>
              <label>시행<select data-f="action">${optHtml(OPT_ACTION, s.action)}</select></label>
              <label>완료<select data-f="done">${optHtml(OPT_DONE, s.done)}</select></label>
            </div>
            <label>조치현황 (Follow-up)</label>
            <div class="fu-list">${(s.followup || "").split("\n").filter(x => x.trim()).map(ln => `<div class="fu-item"><span>${pEsc(ln)}</span></div>`).join("") || '<div class="fu-empty">아직 조치 이력이 없습니다.</div>'}</div>
            <div class="fu-add"><input class="fu-date" placeholder="8/3"><input class="fu-text" placeholder="내용 (예: 8월 시행 / 4분기 진행)"><button class="fu-btn">＋줄 추가·저장</button></div>
            ${photoGroups(s)}<div class="ef-note">📷 사진 추가·삭제는 제안설정에서 · 바꾸면 자동 저장됩니다</div>
          </div>` : `<div class="p-meta"><span class="p-chip">심사결과 <b>${pEsc(s.review || "—")}</b></span><span class="p-chip">시행 <b>${pEsc(s.action || "—")}</b></span><span class="p-chip">완료 <b>${pEsc(s.done || "—")}</b></span>${dd && dd.kind === "date" ? `<span class="p-chip">목표 <b>${pEsc(dd.target)}</b></span>` : ""}</div>
          <h4>조치현황 (Follow-up)</h4><div class="p-follow">${pEsc(s.followup || "—")}</div>${photoGroups(s)}
          <h4>댓글 ${cc}</h4><div class="pcm-list">${clist}</div>
          <div class="pcm-form"><input class="pcm-name" placeholder="이름(실명)" maxlength="20"><input class="pcm-text" placeholder="댓글 입력" maxlength="200"><button class="pcm-send">등록</button></div>`;
        return `<div class="p-card${nw ? ' isnew' : ''}${openKeys.has(k) ? ' open' : ''}${unlocked ? ' editing' : ''}" data-k="${pEsc(k)}">${nw ? '<span class="p-new">NEW</span>' : ''}
          <div class="p-head"><span class="p-id">${pEsc(s.mgmtNo || "")}</span><span class="p-ttl">${pEsc(s.title || "")}</span>${ddBadge}${cc ? `<span class="p-cc">💬 ${cc}</span>` : ''}<span class="p-team">${pEsc(s.team || "")}</span></div>
          <div class="p-detail"><h4>제안 내용</h4><div class="p-content">${pEsc(s.content || "")}</div>${body}</div>
        </div>`; }).join("");
      box.querySelectorAll(".p-card").forEach(card => {
        const k = card.dataset.k, item = P.find(x => x._key === k) || {};
        card.querySelector(".p-head").onclick = () => { card.classList.toggle("open"); card.classList.contains("open") ? openKeys.add(k) : openKeys.delete(k); };
        card.querySelectorAll(".p-photo").forEach(img => img.onclick = () => openImageModal(img.src, "제안 사진"));
        const ttl = card.querySelector(".p-ttl");
        if (ttl && ttl.scrollWidth > ttl.clientWidth + 2) { const b = document.createElement("button"); b.className = "ttl-more"; b.textContent = "⋯"; b.title = "제목 전체 보기"; b.onclick = (e) => { e.stopPropagation(); card.classList.toggle("ttl-open"); }; ttl.after(b); }
        if (unlocked) {
          const saveObj = async (followup) => { const obj = { ...item }; delete obj._key; card.querySelectorAll("[data-f]").forEach(el => obj[el.getAttribute("data-f")] = el.type === "checkbox" ? el.checked : el.value); obj.followup = followup; obj.updatedAt = Date.now(); openKeys.add(k); await set(ref(db, "proposals/" + k), obj); };
          card.querySelector(".fu-btn").onclick = async () => {
            const dEl = card.querySelector(".fu-date"), tEl = card.querySelector(".fu-text");
            const dv = fmtDate(dEl.value); if (!dv) return alert("날짜를 8/3 형식으로 입력하세요.");
            if (!tEl.value.trim()) return alert("내용을 입력하세요.");
            const lines = (item.followup || "").split("\n").filter(x => x.trim()); lines.push(dv + " " + tEl.value.trim());
            const btn = card.querySelector(".fu-btn"); btn.disabled = true;
            try { await saveObj(lines.join("\n")); } catch (e) { alert("저장 실패"); btn.disabled = false; }
          };
          card.querySelectorAll(".fu-del").forEach(b => b.onclick = async () => {
            const lines = (item.followup || "").split("\n").filter(x => x.trim()); lines.splice(+b.dataset.i, 1);
            b.disabled = true;
            try { await saveObj(lines.join("\n")); } catch (e) { alert("삭제 실패"); b.disabled = false; }
          });
          card.querySelectorAll("[data-f]").forEach(el => el.addEventListener("change", async () => {
            try { await saveObj(item.followup); } catch (e) { alert("저장 실패"); }
          }));
        } else {
          card.querySelector(".pcm-send").onclick = async () => {
            const nameEl = card.querySelector(".pcm-name"), textEl = card.querySelector(".pcm-text"), btn = card.querySelector(".pcm-send");
            const name = nameEl.value.trim(), text = textEl.value.trim();
            if (!name) return alert("이름을 입력하세요.");
            if (!text) return alert("댓글 내용을 입력하세요.");
            btn.disabled = true;
            try {
              const ok = await get(ref(db, "scores/" + name));
              if (!ok.exists()) { alert("등록되지 않은 이름입니다.\n명부에 있는 실명으로 입력해 주세요."); btn.disabled = false; return; }
              await push(ref(db, "pcomments/" + ckey(k)), { name, text, time: new Date().toLocaleString("ko-KR") });
              textEl.value = ""; openKeys.add(k);
            } catch (e) { alert("등록 실패. 다시 시도해 주세요."); }
            btn.disabled = false;
          };
        }
      });
    }
    document.querySelectorAll("#pboard .p-tab").forEach(t => t.onclick = () => {
      if (t.dataset.s === "제안설정") { window.open("제안설정.html", "_blank"); return; }
      pTab = t.dataset.s; document.querySelectorAll("#pboard .p-tab:not(.settab)").forEach(x => x.classList.toggle("on", x === t)); pRender();
    });
    pq("#pEdit").onclick = () => {
      if (!unlocked) { if (prompt("수정 암호를 입력하세요") !== "0000") return; unlocked = true; pq("#pEdit").textContent = "🔒 수정 잠금"; }
      else { unlocked = false; pq("#pEdit").textContent = "✏️ 수정"; }
      pRender();
    };
    pq("#pSearch").oninput = pRender;
    document.addEventListener("click", (e) => { if (!e.target.closest(".ttl-more")) document.querySelectorAll("#pboard .p-card.ttl-open").forEach(c => c.classList.remove("ttl-open")); });

    // 현수막 마법
    onValue(ref(db, 'settings/banner'), (snap) => {
      const banner = document.getElementById("noticeBanner");
      if(snap.exists() && snap.val() !== "") {
        banner.innerHTML = "📢 " + snap.val();
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }
    });

    // ⭐ 투표(임시 목록) 활성화 마법 ⭐
    onValue(ref(db, 'settings/voting'), (snap) => {
      const voteData = snap.val();
      const voteBtn = document.getElementById("voteBtn");
      if(voteData && voteData.isActive) {
        voteBtn.innerHTML = `🗳️ ${voteData.title}`; // 관리자가 정한 이름으로 바뀜
        voteBtn.style.display = "block";
      } else {
        voteBtn.style.display = "none";
      }
    });

    // 💡 제안 현황판
    let suggestionBoardActive = false;
    let suggestionsData = null;

    onValue(ref(db, 'settings/suggestionBoard/isActive'), (snap) => {
      suggestionBoardActive = snap.exists() && snap.val() === true;
      renderSuggestionBoard();
    });

    onValue(ref(db, 'suggestions'), (snap) => {
      suggestionsData = snap.exists() ? snap.val() : null;
      renderSuggestionBoard();
    });

    function renderSuggestionBoard() {
      const board = document.getElementById('suggestionBoard');
      board.innerHTML = '';

      if (!suggestionBoardActive || !suggestionsData) {
        board.style.display = 'none';
        return;
      }

      const items = Object.entries(suggestionsData)
        .sort((a, b) => (b[1].time || 0) - (a[1].time || 0))
        .slice(0, 20);

      if (items.length === 0) {
        board.style.display = 'none';
        return;
      }

      board.style.display = 'block';

      const title = document.createElement('h2');
      title.textContent = '💡 우리의 개선 제안';
      title.style.cssText = 'color:#333; margin:20px 0 10px; font-size:26px;';
      board.appendChild(title);

      items.forEach(([key, s]) => {
        const card = document.createElement('div');
        card.style.cssText = 'background:white; border-radius:15px; box-shadow:0 2px 8px rgba(0,0,0,0.08); padding:20px; margin:15px auto; width:90%; max-width:450px; text-align:left;';

        const dateEl = document.createElement('div');
        dateEl.style.cssText = 'font-size:13px; color:gray; margin-bottom:8px;';
        dateEl.textContent = s.date || '';
        card.appendChild(dateEl);

        const contentEl = document.createElement('div');
        contentEl.style.cssText = 'white-space:pre-wrap; font-size:17px; margin-bottom:12px; color:#333;';
        contentEl.textContent = s.content || '';
        card.appendChild(contentEl);

        if (s.beforeThumb || s.afterThumb || s.beforeText || s.afterText) {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:stretch;';

          const buildThumb = (label, thumb, full, text, altText) => {
            if (!thumb && !text) return null;
            const wrap = document.createElement('div');
            wrap.style.cssText = 'flex:1; min-width:120px; max-width:220px; text-align:center; display:flex; flex-direction:column; gap:6px;';
            const lbl = document.createElement('div');
            lbl.style.cssText = 'font-size:14px; font-weight:bold; color:#555;';
            lbl.textContent = label;
            wrap.appendChild(lbl);
            if (thumb) {
              const img = document.createElement('img');
              img.src = thumb;
              img.loading = 'lazy';
              img.alt = altText;
              img.style.cssText = 'width:100%; max-width:200px; border-radius:8px; cursor:pointer; border:1px solid #eee; align-self:center;';
              img.addEventListener('click', () => openImageModal(full || thumb, altText));
              wrap.appendChild(img);
            }
            if (text) {
              const t = document.createElement('div');
              t.style.cssText = 'white-space:pre-wrap; font-size:14px; color:#333; background:#f5f5f5; padding:8px 10px; border-radius:8px; text-align:left; word-break:break-word; line-height:1.4;';
              t.textContent = text;
              wrap.appendChild(t);
            }
            return wrap;
          };

          const b = buildThumb('개선 전', s.beforeThumb, s.beforeFull, s.beforeText, '개선 전 사진');
          const a = buildThumb('개선 후', s.afterThumb, s.afterFull, s.afterText, '개선 후 사진');
          if (b) row.appendChild(b);
          if (b && a) {
            const arrow = document.createElement('div');
            arrow.textContent = '➡️';
            arrow.setAttribute('aria-hidden', 'true');
            arrow.style.cssText = 'flex:0 0 auto; font-size:32px; color:#ff7043; align-self:center; padding:0 4px;';
            row.appendChild(arrow);
          }
          if (a) row.appendChild(a);
          card.appendChild(row);
        }

        board.appendChild(card);
      });
    }

    function openImageModal(src, altText) {
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px; cursor:pointer;';
      const img = document.createElement('img');
      img.src = src;
      img.alt = altText;
      img.style.cssText = 'max-width:100%; max-height:100%; border-radius:8px;';
      modal.appendChild(img);
      const close = () => { modal.remove(); document.removeEventListener('keydown', escHandler); };
      const escHandler = (e) => { if (e.key === 'Escape') close(); };
      modal.addEventListener('click', close);
      document.addEventListener('keydown', escHandler);
      document.body.appendChild(modal);
    }
  </script>
</body>
</html>
