<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제안 설정 · 조치현황 관리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--ink:#1A2230;--muted:#5B6678;--line:#E6E9EF;--bg:#F4F6FA;--blue:#2563EB;--green:#15803D;--amber:#D97706;--red:#DC2626;--gray:#6B7280}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:20px 14px 60px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:22px;font-weight:800;margin:0 0 3px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}
  input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;color:var(--ink);font-size:14px;font-family:inherit;padding:9px 11px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--blue)}
  textarea{resize:vertical;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px;padding:10px 14px}
  button.primary{background:var(--blue);color:#fff;border:0}
  button.green{background:var(--green);color:#fff;border:0}
  button.danger{background:#fff;color:var(--red);border-color:#FECACA}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input.search{flex:1;min-width:160px}
  .badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
  .b-jin{color:var(--amber);background:#FDF3E3}.b-wan{color:var(--green);background:#DCFCE7}.b-bor{color:var(--gray);background:#EEF0F3}
  .item-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .item-head .id{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .item-head .sp{flex:1}
  .mt{margin-top:10px}
  .gate{max-width:380px;margin:60px auto;text-align:center}
  .hidden{display:none}
  .note{font-size:12px;color:var(--muted);background:#F8FAFC;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:8px}
  .cnt{font-size:13px;color:var(--muted);font-weight:700}
  .p-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .p-tab{flex:1;min-width:80px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 8px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
  .p-tab b{font-weight:800;color:var(--muted)}
  .p-tab.on{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.10)}
  .p-tab.on b{color:var(--blue)}
  .p-tab.newtab{flex:0 0 auto;color:var(--green);border-color:#BBF7D0}
  .p-tab.newtab.on{border-color:var(--green);color:var(--green);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
  .cmod-list{border:1px solid var(--line);border-radius:9px;padding:2px 10px}
  .cmod-item{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0}
  .cmod-item:first-child{border-top:0}
  .cmod-del{padding:5px 10px;font-size:13px;line-height:1;flex:0 0 auto}
  .ph-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .ph-item{position:relative;display:inline-block}
  .ph-item img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
  .ph-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;padding:0;font-weight:800;line-height:1}
  .ph-up{display:inline-block;background:#fff;border:1.5px solid var(--blue);color:var(--blue);border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .pg{margin-bottom:8px}.pg-l{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
  .fu-add{display:flex;gap:6px;margin-top:8px}
  .fu-add .fu-date{flex:0 0 72px}.fu-add .fu-text{flex:1;min-width:80px}
  .fu-btn{flex:0 0 auto;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .fu-list{display:flex;flex-direction:column;gap:5px;margin:6px 0 8px}
  .fu-item{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px;line-height:1.45}
  .fu-item span{white-space:pre-wrap;word-break:break-word}
  .fu-del{flex:0 0 auto;border:0;background:#FEE2E2;color:#B91C1C;font-weight:800;border-radius:6px;padding:1px 8px;cursor:pointer;line-height:1.4}
  .fu-empty{color:var(--muted);font-size:13px;padding:2px 0}
  .aibtn{border:0;background:#EDE9FE;color:#6D28D9;font-weight:800;border-radius:6px;padding:2px 9px;font-size:12px;cursor:pointer;margin-left:6px}
  .aibtn:disabled{opacity:.5}
  .dday{font-size:11px;font-weight:800;color:#B45309;background:#FEF3C7;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .dday.over{color:#991B1B;background:#FEE2E2}
  .dday.txt.orange{color:#fff;background:#F59E0B}.dday.txt.red{color:#fff;background:#EF4444}
  .chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink)}
  .chk input{width:auto;margin:0;transform:scale(1.2)}
  .admonce{font-size:10px;font-weight:700;color:var(--blue);background:#EFF6FF;border-radius:5px;padding:1px 5px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate">
    <h1>제안 설정</h1><div class="sub">조치현황 관리 도구</div>
    <div class="card">
      <label for="pass">비밀번호</label>
      <input id="pass" type="password" placeholder="비밀번호 입력">
      <button class="primary" id="unlock" style="width:100%;margin-top:12px">잠금 해제</button>
    </div>
  </div>

  <div id="panel" class="hidden">
    <h1>제안 설정 · 조치현황 관리</h1>
    <div class="sub">제안별 심사결과·시행여부·완료여부·조치현황(Follow-up)을 관리합니다.</div>

    <div style="margin-bottom:12px"><button class="primary" id="xlsBtn">⬇ 엑셀 다운로드</button></div>
    <div class="p-tabs" id="tabs">
      <button class="p-tab on" data-t="진행중">진행중 <b id="t-jin">0</b></button>
      <button class="p-tab" data-t="완료">완료 <b id="t-wan">0</b></button>
      <button class="p-tab" data-t="미시행">미시행 <b id="t-mis">0</b></button>
      <button class="p-tab" data-t="제안접수">제안접수 <b id="t-jeb">0</b></button>
      <button class="p-tab newtab" data-t="신규작성">＋ 신규작성</button>
    </div>

    <input class="search" id="search" placeholder="관리번호·소속·내용 검색" style="margin-bottom:12px">
    <div id="list"></div>

    <div id="newpane" class="hidden">
      <div class="card">
        <h2 style="margin:0 0 12px;font-size:16px">새 제안 작성</h2>
        <div class="row2">
          <div><label>관리번호</label><input id="n-mgmt"></div>
          <div><label>소속</label><input id="n-team" placeholder="예: 생산팀"></div>
        </div>
        <div class="row3 mt">
          <div><label>제안 구분</label><select id="n-ptype"><option value="">(선택)</option><option>개인</option><option>공공</option><option>분임조</option></select></div>
          <div><label>분류</label><select id="n-category"><option value="">(선택)</option><option>제안</option><option>아차사고</option></select></div>
          <div><label>제안자 성명</label><input id="n-proposer"></div>
        </div>
        <div class="mt"><label>제목</label><input id="n-title"></div>
        <div class="mt"><label>제안 내용</label><textarea id="n-content" rows="4"></textarea></div>
        <div class="row3 mt">
          <div><label>심사결과</label><select id="n-review"><option value="">(선택)</option><option>보류</option><option>참가</option><option>노력</option><option>본사 제출</option></select></div>
          <div><label>시행여부</label><select id="n-action"><option value="">(선택)</option><option>시행</option><option>검토후 시행</option><option>미시행</option></select></div>
          <div><label>완료여부</label><select id="n-done"><option value="">(선택)</option><option value="미완료">미완료</option><option value="완료">완료</option></select></div>
        </div>
        <div class="mt"><label>조치현황 / 비고</label><textarea id="n-follow" rows="3" placeholder="26.08.03 접수"></textarea></div>
        <div class="mt"><label class="chk"><input type="checkbox" id="n-prize"> 💰 상금 기안 완료</label></div>
        <div class="mt"><button class="green" id="createBtn" style="width:100%">추가</button></div>
      </div>
      <div class="card">
        <label>엑셀 가져오기 (CSV UTF-8)</label>
        <div class="toolbar" style="margin-bottom:6px">
          <input type="file" id="csvFile" accept=".csv" style="flex:1">
          <button class="primary" id="importBtn">가져오기</button>
        </div>
        <div class="note">엑셀에서 <b>파일 ▸ 다른 이름으로 저장 ▸ CSV UTF-8</b>로 저장 후 올리세요. 같은 관리번호는 덮어쓰고, 새 번호는 추가됩니다.</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { db, ref, get, set, update, onValue, storage, sRef, uploadBytes, getDownloadURL } from "./firebase-setup.js";

const PASS="0000"; // ← 배포 전 변경 (관리자 모드와 별개)
const GEMINI_KEY=""; // AI 정리는 서버(파이어베이스 함수) 연동으로 이전 예정. 보안상 키를 코드에 두지 않음.
const GEMINI_MODEL="gemini-3.6-flash";
const monthOptions=v=>{let h='<option value=""'+(!v?' selected':'')+'>(미지정)</option>';for(let m=1;m<=12;m++)h+='<option value="'+m+'"'+(String(v)===String(m)?' selected':'')+'>'+m+'월</option>';return h;};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const keyOf=id=>String(id||"").trim().replace(/[.#$/\[\]]/g,"-");
const statusOf=s=>{const d=(s.done||"").trim();if((s.action||"").includes("미시행"))return"미시행";if(d==="완료")return"완료";if(d==="미완료")return"진행중";return"제안접수";};
const badgeOf=st=>st==="완료"?"b-wan":st==="미진행"?"b-bor":"b-jin";
const OPT_REVIEW=["","최우수","우수","장려","노력","참가","본사 제출","불채택","보류"], OPT_ACTION=["","시행","검토후 시행","미시행"];
const PRIZE={최우수:[1000000,2000000],우수:[500000,1000000],장려:[150000,300000],노력:[30000,100000],참가:[5000,10000]}; // [단일제안,그룹제안]
const AWARD_ORDER=["참가","노력","장려","우수","최우수"];
const normAward=r=>{r=(r||"").replace(/상\s*$/,"").trim();return PRIZE[r]?r:null;};
const isGroupProp=s=>(s.ptype||"")==="분임조"; // 그룹제안=분임조, 그 외=단일제안
const optHtml=(opts,val)=>opts.map(o=>`<option value="${esc(o)}"${(val||"")===o?" selected":""}>${o===""?"(선택)":o}</option>`).join("");
const normPh=p=>typeof p==="string"?{url:p,kind:"before"}:p;
const fmtDate=v=>{v=(v||"").trim();if(/^\d{2}\.\d{2}\.\d{2}$/.test(v))return v;if(/^\d{6}$/.test(v))return v.slice(0,2)+"."+v.slice(2,4)+"."+v.slice(4,6);const m=v.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})$/);if(!m)return null;const yy=String(new Date().getFullYear()%100).padStart(2,"0");return yy+"."+String(+m[1]).padStart(2,"0")+"."+String(+m[2]).padStart(2,"0");};
function targetMD(line){const yy=new Date().getFullYear()%100,cands=[];let m;const rQ=/([1-4])\s*분기/g;while((m=rQ.exec(line)))cands.push({mo:[3,6,9,12][+m[1]-1],dd:[31,30,30,31][+m[1]-1],pos:m.index});const rM=/(\d{1,2})\s*월/g;while((m=rM.exec(line))){const mo=+m[1];if(mo>=1&&mo<=12)cands.push({mo,dd:new Date(2000+yy,mo,0).getDate(),pos:m.index});}if(!cands.length)return null;const impl=[...line.matchAll(/시행|진행|설치|완료|예정|교체|보완/g)].map(x=>x.index);let best=null;for(const c of cands)for(const ip of impl)if(ip>=c.pos){const g=ip-c.pos;if(!best||g<best.g)best={c,g};}return best?best.c:cands[cands.length-1];}
function ddayOf(s){const fu=(s.followup||"").trim();if(!fu)return null;const last=fu.split("\n").map(x=>x.trim()).filter(Boolean).pop()||"";const md=targetMD(last),yy=new Date().getFullYear()%100;if(md){const target=String(yy).padStart(2,"0")+"."+String(md.mo).padStart(2,"0")+"."+String(md.dd).padStart(2,"0");const tgt=new Date(2000+yy,md.mo-1,md.dd),today=new Date();today.setHours(0,0,0,0);return{kind:"date",target,days:Math.round((tgt-today)/86400000)};}const raw=last.replace(/^(\d{2}\.\d{2}\.\d{2}|\d{6})\s*/,"").trim();if(!raw)return null;const t=/추후/.test(raw);return{kind:"text",label:t?"추후 진행":"날짜 미선정",tone:t?"orange":"red"};}
function openImageModal(src){const m=document.createElement("div");m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;cursor:pointer";const i=document.createElement("img");i.src=src;i.style.cssText="max-width:100%;max-height:100%;border-radius:8px";m.appendChild(i);m.onclick=()=>m.remove();document.body.appendChild(m);}
let ITEMS=[], curTab="진행중", COMMENTS={};

$("#unlock").onclick=()=>{ if($("#pass").value===PASS){$("#gate").classList.add("hidden");$("#panel").classList.remove("hidden");start();} else Swal.fire('오류','비밀번호가 올바르지 않습니다.','error'); };
$("#pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#unlock").click();});

function start(){
  onValue(ref(db,"proposals"),snap=>{
    const d=snap.val()||{};
    ITEMS=Object.entries(d).map(([k,v])=>({...v,_key:k})).sort((a,b)=>(a.no||0)-(b.no||0));
    const c={진행중:0,완료:0,미시행:0,제안접수:0}; ITEMS.forEach(s=>c[statusOf(s)]++);
    $("#t-jin").textContent=c.진행중; $("#t-wan").textContent=c.완료; $("#t-mis").textContent=c.미시행; $("#t-jeb").textContent=c.제안접수;
    render();
  });
  onValue(ref(db,"pcomments"),snap=>{ COMMENTS=snap.val()||{}; renderComments(); });
}
function renderComments(){
  document.querySelectorAll("#list .card[data-k]").forEach(card=>{
    const k=card.dataset.k, box=card.querySelector(".cmod-list"); if(!box)return;
    const cents=Object.entries(COMMENTS[k]||{}).sort((a,b)=>a[0]<b[0]?-1:1);
    card.querySelector(".cmod-n").textContent=cents.length;
    if(!cents.length){box.innerHTML='<div style="color:var(--muted);font-size:13px;padding:4px 0">댓글 없음</div>';return;}
    box.innerHTML=cents.map(([id,c])=>`<div class="cmod-item"><div><b>${esc(c.name)}</b> <span style="color:var(--muted);font-size:12px">${esc(c.time)}</span><div style="white-space:pre-wrap;font-size:14px;margin-top:2px">${esc(c.text)}</div></div><button class="danger cmod-del" data-id="${esc(id)}">삭제</button></div>`).join("");
    box.querySelectorAll(".cmod-del").forEach(b=>b.onclick=async()=>{ const c=await Swal.fire({icon:'warning',title:'댓글 삭제',showCancelButton:true,confirmButtonText:'삭제',cancelButtonText:'취소',confirmButtonColor:'#DC2626'}); if(c.isConfirmed) await set(ref(db,"pcomments/"+k+"/"+b.dataset.id),null); });
  });
}
function setTab(t){
  curTab=t;
  document.querySelectorAll("#tabs .p-tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  const isNew=t==="신규작성";
  $("#search").style.display=isNew?"none":"";
  $("#list").style.display=isNew?"none":"";
  $("#newpane").classList.toggle("hidden",!isNew);
  if(isNew && !$("#n-mgmt").value) $("#n-mgmt").value=nextId().id;
  if(!isNew) render();
}
document.querySelectorAll("#tabs .p-tab").forEach(b=>b.onclick=()=>setTab(b.dataset.t));

function render(){
  if(curTab==="신규작성")return;
  const q=($("#search").value||"").replace(/\s+/g,"").toLowerCase();
  let rows=ITEMS.filter(s=>statusOf(s)===curTab);
  if(q) rows=rows.filter(s=>((s.mgmtNo||"")+(s.team||"")+(s.title||"")+(s.content||"")).replace(/\s+/g,"").toLowerCase().includes(q));
  const box=$("#list");
  if(!rows.length){box.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">'+(ITEMS.length?"이 상태의 제안이 없습니다.":"등록된 제안이 없습니다. ＋신규작성 탭에서 추가하거나 엑셀을 가져오세요.")+'</div>';return;}
  box.innerHTML=rows.map(s=>{
    const st=statusOf(s),k=esc(s._key),dd=(st==="완료"||st==="미시행")?null:ddayOf(s);
    return `<div class="card" data-k="${k}">
      <div class="item-head">
        <span class="id">${esc(s.mgmtNo||s._key)}</span>
        ${dd?(dd.kind==="date"?`<span class="dday${dd.days<0?' over':''}">${dd.days>=0?"D-"+dd.days:"D+"+(-dd.days)} · ${dd.target}</span>`:`<span class="dday txt ${dd.tone}">${esc(dd.label)}</span>`):""}
        <span class="sp"></span>
        <button class="danger" data-del="${k}">삭제</button>
      </div>
      <div class="row3">
        <div><label>소속</label><input data-f="team" value="${esc(s.team||"")}"></div>
        <div><label>관리번호</label><input data-f="mgmtNo" value="${esc(s.mgmtNo||"")}"></div>
        <div><label>월 <span class="admonce">엑셀 구분용</span></label><select data-f="month">${monthOptions(s.month)}</select></div>
      </div>
      <div class="row3 mt">
        <div><label>제안 구분 <span class="admonce">관리자용</span></label><select data-f="ptype"><option value=""${!s.ptype?" selected":""}>(선택)</option><option value="개인"${s.ptype==="개인"?" selected":""}>개인</option><option value="공공"${s.ptype==="공공"?" selected":""}>공공</option><option value="분임조"${s.ptype==="분임조"?" selected":""}>분임조</option></select></div>

async function aiPolish(card){
  if(!GEMINI_KEY) return Swal.fire('준비 중','AI 정리 기능은 서버 연동 준비 중입니다. 곧 다시 사용할 수 있습니다.','info');
  const ta=card.querySelector('textarea[data-f=content]'); const src=(ta.value||"").trim();
  if(!src) return Swal.fire('알림','정리할 제안 내용이 없습니다.','warning');
  const b=card.querySelector('.aibtn'), ot=b.textContent; b.disabled=true; b.textContent="정리 중…";
  const prompt="너는 산업안전 제안 정리 담당자야. 아래 현장 제안 원문의 맞춤법과 문장을 자연스럽게 다듬고, 반드시 '① 제안 내용 / ② 현재 문제점 / ③ 개선 방안' 세 항목으로 간결히 정리해줘. 사실·수치·고유명사는 절대 바꾸지 말고 표현만 다듬어. 인사말·머리말 없이 세 항목만 출력해.\n\n원문:\n"+src;
  try{
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent?key='+GEMINI_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    const j=await res.json();
    if(!res.ok) throw new Error((j.error&&j.error.message)||('HTTP '+res.status));
    const out=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text;
    if(!out) throw new Error('결과가 비었습니다');
    ta.value=out.trim();
    Swal.fire({icon:'success',title:'AI 정리 완료',text:'내용을 확인한 뒤 저장을 눌러주세요.',timer:1600,showConfirmButton:false});
  }catch(e){ console.error(e); Swal.fire('오류','AI 정리 실패: '+e.message,'error'); }
  b.disabled=false; b.textContent=ot;
}
async function fuSave(card,k,item,followup){
  const obj={...item};delete obj._key;
  card.querySelectorAll("[data-f]").forEach(el=>{const f=el.getAttribute("data-f");obj[f]=el.type==="checkbox"?el.checked:el.value.trim();});
  obj.followup=followup;obj.updatedAt=Date.now();
  try{await set(ref(db,"proposals/"+k),obj);}catch(e){console.error(e);Swal.fire('오류','저장 실패','error');}
}
async function uploadPhotos(inp){
  const k=inp.dataset.k, kind=inp.dataset.kind||"before", files=[...inp.files]; if(!files.length)return;
  const item=ITEMS.find(x=>x._key===k)||{}; const lbl=inp.parentElement; const orig=lbl.firstChild.textContent; lbl.firstChild.textContent="업로드 중…";
  try{
    const add=[];
    for(const f of files){ const r=sRef(storage,"proposalPhotos/"+k+"/"+Date.now()+"_"+f.name); await uploadBytes(r,f); add.push({url:await getDownloadURL(r),kind}); }
    await set(ref(db,"proposals/"+k+"/photos"),(item.photos||[]).map(normPh).concat(add));

function monthOf(s){ if(s.month)return s.month; const m=(s.followup||"").match(/\d{2}\.(\d{2})\.\d{2}/); return m?parseInt(m[1],10):""; }
function downloadExcel(){
  if(!ITEMS.length)return Swal.fire('알림','내려받을 데이터가 없습니다.','info');
  if(typeof XLSX==="undefined")return Swal.fire('오류','엑셀 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.','error');
  const sorted=ITEMS.slice().sort((a,b)=>(a.no||0)-(b.no||0));
  const byMonth=(a,b)=>(parseInt(a)||99)-(parseInt(b)||99);
  const wb=XLSX.utils.book_new();
  // 1) 제안 통합 정리 (월별 시트)
  const H=["No","년","월","관리번호","소속","이름","제안구분","제안내용","심사결과","시행여부","조치현황","완료여부"];
  const g={};
  sorted.forEach(s=>{const mo=monthOf(s),key=mo?mo+"월":"미지정";(g[key]=g[key]||[]).push([s.no||"",s.year||"",mo||"",s.mgmtNo||"",s.team||"",s.proposer||"",s.ptype||"",s.content||"",s.review||"",s.action||"",s.followup||"",s.done||""]);});
  Object.keys(g).sort(byMonth).forEach(n=>{const ws=XLSX.utils.aoa_to_sheet([H,...g[n]]);ws["!cols"]=[{wch:5},{wch:6},{wch:5},{wch:14},{wch:12},{wch:8},{wch:8},{wch:50},{wch:10},{wch:12},{wch:40},{wch:8}];XLSX.utils.book_append_sheet(wb,ws,n);});
  // 2) 제안 상금 내역 (월별 시트 · 사람별 집계)
  const PH=["No","년","월","관리번호","소속","이름","심사결과","금액"];
  const pm={};
  sorted.forEach(s=>{const a=normAward(s.review);if(a!=="참가"&&a!=="노력")return;/* 장려 이상은 본사 진행이라 우리 상금내역 제외 */const mo=monthOf(s),mk=mo?mo:"미지정",person=(s.proposer||"").trim()||"(미기재)";
    pm[mk]=pm[mk]||{}; const p=pm[mk][person]=pm[mk][person]||{team:s.team||"",year:s.year||2026,counts:{},amount:0,nos:[]};
    p.counts[a]=(p.counts[a]||0)+1; p.amount+=PRIZE[a][isGroupProp(s)?1:0]; p.nos.push(s.mgmtNo||""); if(!p.team&&s.team)p.team=s.team;});
  Object.keys(pm).sort(byMonth).forEach(mk=>{
    const rows=[]; let i=1;
    Object.keys(pm[mk]).forEach(person=>{const p=pm[mk][person];const lab=AWARD_ORDER.filter(k=>p.counts[k]).map(k=>k+" "+p.counts[k]).join(", ");
      rows.push([i++,p.year,mk==="미지정"?"":mk,p.nos.join(", "),p.team,person,lab,p.amount]);});
    if(!rows.length)return;
    const ws=XLSX.utils.aoa_to_sheet([PH,...rows]);ws["!cols"]=[{wch:5},{wch:6},{wch:5},{wch:22},{wch:12},{wch:10},{wch:16},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws,"상금 "+(mk==="미지정"?"미지정":mk+"월"));});
  XLSX.writeFile(wb,"제안 통합 정리.xlsx");
}

// ── CSV 가져오기 ──
function parseCSV(text){
  const rows=[];let row=[],f="",i=0,q=false;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i<text.length){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++;continue;}
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f="";i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f="";i++;continue;}
    f+=c;i++;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
// self-check
console.assert(JSON.stringify(parseCSV('a,"b,c","d\ne"'))===JSON.stringify([["a","b,c","d\ne"]]),"parseCSV 실패");

function col(headers,names){ for(const n of names){const i=headers.findIndex(h=>h.replace(/\s+/g,"").includes(n));if(i>=0)return i;} return -1; }

$("#importBtn").onclick=()=>{
  const file=$("#csvFile").files[0];
  if(!file)return Swal.fire('알림','CSV 파일을 먼저 선택하세요.','warning');
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const rows=parseCSV(rd.result).filter(r=>r.some(c=>c.trim()));
      // 헤더 행 찾기 (관리번호 포함된 행)
      let hi=rows.findIndex(r=>r.some(c=>c.replace(/\s+/g,"").includes("관리번호")));
      if(hi<0)hi=0;
      const H=rows[hi];
      const iNo=col(H,["No"]),iYear=col(H,["년"]),iId=col(H,["관리번호"]),iTeam=col(H,["소속"]),
            iContent=col(H,["제안내용"]),iReview=col(H,["심사결과"]),iAction=col(H,["시행여부"]),
            iBigo=col(H,["비고"]),iDone=col(H,["완료여부"]);
      if(iId<0)return Swal.fire('오류','헤더에서 "관리번호" 열을 찾지 못했습니다.','error');
      const map={};let n=0;
      for(let r=hi+1;r<rows.length;r++){
        const R=rows[r];const id=(R[iId]||"").trim();if(!id)continue;
        const content=(R[iContent]||"").trim();
        map[keyOf(id)]={
          no:Number((R[iNo]||"").replace(/\D/g,""))||0,
          year:Number((R[iYear]||"").replace(/\D/g,""))||2026,
          mgmtNo:id, team:(R[iTeam]||"").trim(),
          title:content.split("\n")[0].trim(), content:content,
          review:iReview>=0?(R[iReview]||"").trim():"",
          action:iAction>=0?(R[iAction]||"").trim():"",
          followup:iBigo>=0?(R[iBigo]||"").trim():"",
          done:iDone>=0?(R[iDone]||"").trim():""
        };n++;
      }
      if(!n)return Swal.fire('알림','가져올 데이터 행이 없습니다.','info');
      const c=await Swal.fire({icon:'question',title:`${n}건 가져오기`,text:'같은 관리번호는 덮어쓰고, 새 번호는 추가됩니다.',showCancelButton:true,confirmButtonText:'가져오기',cancelButtonText:'취소'});
      if(!c.isConfirmed)return;
      await update(ref(db,"proposals"),map);
      Swal.fire('완료',`${n}건을 가져왔습니다.`,'success');
    }catch(e){console.error(e);Swal.fire('오류','CSV 파싱 실패: '+e.message,'error');}
  };
  rd.readAsText(file,"utf-8");
};
