<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전표어 투표 · 관리(분기 마감/보관)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root{--ink:#1A2230;--muted:#5B6678;--line:#E6E9EF;--green:#15803D;--amber:#D97706;--red:#DC2626;--bg:#F4F6FA}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;padding:24px 16px 60px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:22px;font-weight:800;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(20,30,50,.04)}
  .card h2{font-size:15px;font-weight:800;margin:0 0 14px;color:var(--ink)}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap}
  .stat{flex:1;min-width:120px;background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .k{font-size:12px;color:var(--muted);font-weight:600}
  .stat .v{font-size:24px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
  label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:0 0 6px}
  input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font-size:15px;font-family:inherit;padding:11px 12px;outline:none}
  input:focus{border-color:var(--green)}
  button{font-family:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px;padding:12px 16px}
  button.primary{background:var(--green);color:#fff;border:0}
  button.danger{background:var(--red);color:#fff;border:0}
  button:disabled{opacity:.5;cursor:not-allowed}
  .danger-note{font-size:13px;color:var(--red);background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:10px 12px;margin:12px 0}
  .arch{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .arch:last-child{border-bottom:0}
  .arch .id{font-weight:800}.arch .meta{color:var(--muted);font-size:13px}
  .gate{max-width:380px;margin:60px auto;text-align:center}
  .hidden{display:none}
  /* 투표자 명단 */
  .vfilter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .vfilter input{flex:1;min-width:150px}
  .vfilter button{flex:0 0 auto}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:#fff;color:var(--ink);padding:10px 14px;font-size:13px;font-weight:700}
  .seg button.on{background:var(--green);color:#fff}
  .vcount{font-size:13px;color:var(--muted);font-weight:700;margin-left:6px}
  .vscroll{max-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
  .vtable{width:100%;border-collapse:collapse;font-size:13px}
  .vtable th{position:sticky;top:0;background:#F8FAFC;text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:9px 10px;border-bottom:2px solid var(--line)}
  .vtable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .vtable tr:last-child td{border-bottom:0}
  .vtable .nm{font-weight:800;white-space:nowrap}
  .vtable .tm{color:var(--muted);white-space:nowrap}
  .chbadge{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .chbadge.sm{color:#B45309;background:#FDF3E3}
  .chbadge.qr{color:#166534;background:#DCFCE7}
  .nvchips{display:flex;flex-wrap:wrap;gap:6px;max-height:360px;overflow-y:auto}
  .nvchip{font-size:13px;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;border-radius:8px;padding:5px 10px;font-weight:700}
  .vmuted{color:var(--muted);font-size:13px;padding:12px 4px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 비밀번호 잠금 -->
  <div id="gate" class="gate">
    <h1>관리자 인증</h1>
    <div class="sub">분기 마감·보관 도구</div>
    <div class="card">
      <label for="pass">비밀번호</label>
      <input id="pass" type="password" placeholder="비밀번호 입력">
      <button class="primary" id="unlock" style="width:100%;margin-top:12px">잠금 해제</button>
    </div>
  </div>

  <!-- 본문 -->
  <div id="panel" class="hidden">
    <h1>안전표어 투표 관리</h1>
    <div class="sub">분기 마감 시 결과를 <b>보관 후 초기화</b>합니다. 세이프미 항목 설정은 세이프미에서 하세요.</div>

    <div class="card">
      <h2>현재 진행 중인 투표</h2>
      <div class="stat-row">
        <div class="stat"><div class="k">제목</div><div class="v" id="sTitle" style="font-size:16px">—</div></div>
        <div class="stat"><div class="k">투표 인원</div><div class="v" id="sVotes">0</div></div>
        <div class="stat"><div class="k">대상(scores)</div><div class="v" id="sScores">0</div></div>
      </div>
    </div>

    <div class="card">
      <h2>투표자 명단 <span class="vcount" id="voterCount">—</span></h2>
      <div class="vfilter">
        <div class="seg">
          <button id="segVoted" class="on">투표함</button>
          <button id="segNon">미투표 (등록자)</button>
        </div>
        <input id="voterSearch" placeholder="이름·팀 검색">
        <button id="refreshBtn">↻ 새로고침</button>
        <button id="csvBtn">CSV 내려받기</button>
      </div>
      <div id="voterPane"><div class="vmuted">불러오는 중…</div></div>
    </div>

    <div class="card">
      <h2>분기 마감 → 보관 후 초기화</h2>
      <label for="eid">보관 이름 (분기/회차)</label>
      <input id="eid" placeholder="예: 2026Q1">
      <div class="danger-note">⚠️ 현재 <b>votes/</b>를 <b>archive/[보관이름]</b>으로 복사한 뒤 비웁니다. 비운 표는 되돌릴 수 없습니다(보관본은 남습니다).</div>
      <button class="danger" id="closeBtn" style="width:100%">보관 후 초기화 실행</button>
    </div>

    <div class="card">
      <h2>지난 분기 보관함</h2>
      <div id="archList"><div class="meta" style="color:var(--muted)">불러오는 중…</div></div>
    </div>
  </div>
</div>

<script type="module">
import { db, ref, get, set } from "./firebase-setup.js";

const ADMIN_PASS = "0000"; // ← 배포 전 변경하세요

const $=s=>document.querySelector(s);
$("#unlock").onclick=()=>{ if($("#pass").value===ADMIN_PASS){ $("#gate").classList.add("hidden"); $("#panel").classList.remove("hidden"); init(); }
  else Swal.fire('오류','비밀번호가 올바르지 않습니다.','error'); };
$("#pass").addEventListener("keydown",e=>{ if(e.key==="Enter")$("#unlock").click(); });

async function loadCurrent(){
  const [vs,sc,cfg]=await Promise.all([ get(ref(db,"votes")), get(ref(db,"scores")), get(ref(db,"settings/voting")) ]);
  const votes=vs.val()||{}, scores=sc.val()||{}, conf=cfg.val()||{};
  $("#sTitle").textContent=conf.title||"(설정 없음)";
  $("#sVotes").textContent=Object.keys(votes).length;
  $("#sScores").textContent=Object.keys(scores).length;
  // 보관 이름 기본값 추천 (연도+분기)
  const d=new Date(), q=Math.floor(d.getMonth()/3)+1;
  if(!$("#eid").value) $("#eid").value=d.getFullYear()+"Q"+q;
  return {votes, conf};
}
async function loadArchive(){
  const snap=await get(ref(db,"archive")); const data=snap.val()||{};
  const ids=Object.keys(data).sort().reverse();
  const box=$("#archList");
  if(!ids.length){ box.innerHTML='<div class="meta">아직 보관된 분기가 없습니다.</div>'; return; }
  box.innerHTML="";
  ids.forEach(id=>{ const a=data[id]||{}; const cnt=a.votes?Object.keys(a.votes).length:0;
    // 1위 계산
    const c={}; if(a.votes) for(const n in a.votes){const s=a.votes[n].selected; c[s]=(c[s]||0)+1;}
    let top="—",mx=-1; for(const k in c){ if(c[k]>mx){mx=c[k];top=k;} }
    const row=document.createElement("div"); row.className="arch";
    row.innerHTML=`<div><div class="id">${id}</div><div class="meta">${a.title||""} · ${cnt}표</div></div>
      <div class="meta" style="text-align:right;max-width:55%">🏆 ${top}${mx>0?` (${mx}표)`:""}</div>`;
    box.appendChild(row); });
}
async function init(){ await loadCurrent(); await loadArchive(); await loadVoters(); }

// ── 투표자 명단 ──
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let VOTERS=[], SCORES=[], segMode="voted";
async function loadVoters(){
  const [vs,sc]=await Promise.all([ get(ref(db,"votes")), get(ref(db,"scores")) ]);
  const votes=vs.val()||{}, scores=sc.val()||{};
  VOTERS=Object.keys(votes).map(n=>({name:n,team:votes[n]&&votes[n].team,selected:votes[n]&&votes[n].selected,channel:votes[n]&&votes[n].channel,time:votes[n]&&votes[n].time}));
  SCORES=Object.keys(scores);
  renderVoters();
}
function renderVoters(){
  const q=($("#voterSearch").value||"").replace(/\s+/g,"").toLowerCase();
  const pane=$("#voterPane");
  if(segMode==="voted"){
    let rows=VOTERS.slice().sort((a,b)=>a.name.localeCompare(b.name,"ko"));
    if(q) rows=rows.filter(r=>((r.name||"")+(r.team||"")).replace(/\s+/g,"").toLowerCase().includes(q));
    $("#voterCount").textContent="총 "+VOTERS.length+"명 투표";
    if(!rows.length){ pane.innerHTML='<div class="vmuted">'+(VOTERS.length?"검색 결과가 없습니다.":"아직 투표한 사람이 없습니다.")+'</div>'; return; }
    let h='<div class="vscroll"><table class="vtable"><thead><tr><th>이름</th><th>팀</th><th>선택한 표어</th><th>채널</th><th>시간</th></tr></thead><tbody>';
    rows.forEach(r=>{ const ch=r.channel==="qr"?"qr":"sm";
      h+=`<tr><td class="nm">${esc(r.name)}</td><td class="tm">${esc(r.team||"—")}</td><td>${esc(r.selected||"")}</td>`
       + `<td><span class="chbadge ${ch}">${ch==="qr"?"QR":"세이프미"}</span></td><td class="tm">${esc(r.time||"")}</td></tr>`; });
    pane.innerHTML=h+'</tbody></table></div>';
  } else {
    const voted=new Set(VOTERS.map(v=>v.name));
    let non=SCORES.filter(n=>!voted.has(n)).sort((a,b)=>a.localeCompare(b,"ko"));
    if(q) non=non.filter(n=>n.replace(/\s+/g,"").toLowerCase().includes(q));
    $("#voterCount").textContent="미투표 "+non.length+"명 / 등록 "+SCORES.length+"명";
    if(!non.length){ pane.innerHTML='<div class="vmuted">'+(SCORES.length?"등록자 전원이 투표했거나 검색 결과가 없습니다.":"등록 명부(scores)가 비어 있습니다.")+'</div>'; return; }
    pane.innerHTML='<div class="nvchips">'+non.map(n=>`<span class="nvchip">${esc(n)}</span>`).join("")+'</div>';
  }
}
function downloadCSV(){
  if(!VOTERS.length) return Swal.fire('알림','내려받을 투표 데이터가 없습니다.','info');
  const rows=[["이름","팀","선택한 표어","채널","시간"]];
  VOTERS.slice().sort((a,b)=>a.name.localeCompare(b.name,"ko"))
    .forEach(r=>rows.push([r.name,r.team||"",r.selected||"",r.channel==="qr"?"QR":"세이프미",r.time||""]));
  const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="투표자명단.csv"; a.click(); URL.revokeObjectURL(a.href);
}
$("#segVoted").onclick=()=>{ segMode="voted"; $("#segVoted").classList.add("on"); $("#segNon").classList.remove("on"); renderVoters(); };
$("#segNon").onclick=()=>{ segMode="non"; $("#segNon").classList.add("on"); $("#segVoted").classList.remove("on"); renderVoters(); };
$("#voterSearch").oninput=renderVoters;
$("#refreshBtn").onclick=loadVoters;
$("#csvBtn").onclick=downloadCSV;

$("#closeBtn").onclick=async()=>{
  const id=$("#eid").value.trim();
  if(!id) return Swal.fire('알림','보관 이름(분기)을 입력하세요.','warning');
  if(/[.#$\[\]\/]/.test(id)) return Swal.fire('오류','보관 이름에 . # $ [ ] / 는 쓸 수 없습니다.','error');

  const {votes, conf}=await loadCurrent();
  const cnt=Object.keys(votes).length;

  const exists=await get(ref(db,"archive/"+id));
  if(exists.exists()){ const ok=await Swal.fire({icon:'warning',title:`'${id}' 보관본이 이미 있습니다`,text:'덮어쓸까요?',showCancelButton:true,confirmButtonText:'덮어쓰기',cancelButtonText:'취소'}); if(!ok.isConfirmed)return; }

  const c=await Swal.fire({icon:'question',title:'보관 후 초기화 실행',
    html:`<b>${conf.title||'현재 투표'}</b><br>${cnt}표를 <b>archive/${id}</b>에 보관하고<br>votes/를 비웁니다.`,
    showCancelButton:true,confirmButtonText:'실행',cancelButtonText:'취소',confirmButtonColor:'#DC2626'});
  if(!c.isConfirmed) return;

  try{
    // 1) 보관
    await set(ref(db,"archive/"+id), {
      title: conf.title||"", options: conf.options||[], votes: votes,
      voted: cnt, closedAt: new Date().toLocaleString('ko-KR')
    });
    // 2) 초기화
    await set(ref(db,"votes"), null);
    // 3) 투표 비활성화 (세이프미 설정은 그대로, 진행 상태만 종료)
    await set(ref(db,"settings/voting/isActive"), false);

    await Swal.fire('완료',`'${id}'에 ${cnt}표를 보관하고 초기화했습니다.`,'success');
    await init();
  }catch(e){ console.error(e); Swal.fire('오류','처리 중 문제가 발생했습니다.','error'); }
};
</script>
</body>
</html>
