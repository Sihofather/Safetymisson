<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전표어 투표 · QR 포스터</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--ink:#1A2230;--muted:#5B6678;--green:#15803D;--green-soft:#E7F4EC;--amber:#D97706;--amber-soft:#FDF3E3;--cream:#FFFDF6;--line:#E7E2D5}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:#3A4150;color:var(--ink);-webkit-font-smoothing:antialiased}

  /* 설정 패널 (인쇄 안 됨) */
  .controls{position:sticky;top:0;z-index:10;background:#222936;color:#E9EDF3;padding:16px clamp(14px,4vw,28px);
    display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .controls .grp{display:flex;flex-direction:column;gap:5px}
  .controls label{font-size:11px;color:#9AA6B8;font-weight:700;letter-spacing:.03em}
  .controls input{background:#161C27;border:1px solid #39424f;border-radius:9px;color:#fff;font-size:14px;font-family:inherit;padding:9px 11px;outline:none}
  .controls input:focus{border-color:var(--green)}
  .controls .url{min-width:min(360px,70vw)}
  .controls button{background:var(--green);color:#fff;border:0;border-radius:9px;font-weight:800;font-size:14px;padding:10px 18px;cursor:pointer;font-family:inherit}
  .controls button:hover{background:#177a3c}
  .controls .hint{font-size:12px;color:#7d8aa0;width:100%}

  /* A4 포스터 */
  .page{width:210mm;min-height:297mm;margin:22px auto;background:var(--cream);position:relative;
    padding:20mm 18mm;box-shadow:0 18px 50px rgba(0,0,0,.4);overflow:hidden}
  .page::before{content:"";position:absolute;inset:8mm;border:2.5px solid var(--green);border-radius:10px;pointer-events:none}
  .page::after{content:"";position:absolute;top:8mm;left:8mm;right:8mm;height:14mm;background:var(--green);border-radius:8px 8px 0 0}
  .inner{position:relative;z-index:1}
  .eyebrow{position:relative;z-index:2;color:#fff;font-weight:800;letter-spacing:.06em;text-align:center;
    font-size:15px;height:14mm;display:flex;align-items:center;justify-content:center;margin:-8mm -6mm 0}
  .h1{text-align:center;font-size:40px;font-weight:800;line-height:1.15;margin:46px 0 6px;color:var(--ink)}
  .h1 b{color:var(--green)}
  .sub{text-align:center;font-size:20px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .period{text-align:center;display:inline-flex;gap:8px;align-items:center;font-size:15px;font-weight:700;color:var(--amber);
    background:var(--amber-soft);border:1px solid #F1D9AE;padding:7px 16px;border-radius:999px}
  .period-wrap{text-align:center;margin-bottom:26px}
  .qr-frame{width:62mm;height:62mm;margin:0 auto;background:#fff;border:3px solid var(--ink);border-radius:14px;
    padding:5mm;display:flex;align-items:center;justify-content:center}
  .qr-frame img,.qr-frame canvas{width:100%!important;height:100%!important;display:block}
  .scan{text-align:center;font-size:23px;font-weight:800;margin:22px 0 4px}
  .scan .cam{color:var(--green)}
  .steps{display:flex;justify-content:center;gap:14px;margin:22px 0 8px;flex-wrap:wrap}
  .step{display:flex;flex-direction:column;align-items:center;gap:8px;width:150px;text-align:center}
  .step .badge{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:20px;
    display:flex;align-items:center;justify-content:center}
  .step .t{font-size:15px;font-weight:700;line-height:1.35}
  .note{margin-top:30px;text-align:center;background:var(--green-soft);border-radius:10px;padding:14px;color:#10632F;font-weight:700;font-size:16px}
  .foot{position:absolute;left:18mm;right:18mm;bottom:16mm;display:flex;justify-content:space-between;
    font-size:13px;color:var(--muted);font-weight:600}

  @media print{
    body{background:#fff}
    .controls{display:none}
    .page{margin:0;box-shadow:none;width:auto;min-height:auto}
    @page{size:A4;margin:0}
  }
  @media (max-width:840px){.page{width:auto;min-height:auto;padding:14mm 8mm}.h1{font-size:30px}.steps{gap:8px}.step{width:130px}}
</style>
</head>
<body>
  <div class="controls">
    <div class="grp url">
      <label>① 투표 페이지 주소 (vote-qr.html 배포 URL)</label>
      <input id="cUrl" class="url" placeholder="https://아이디.github.io/레포/vote-qr.html">
    </div>
    <div class="grp"><label>② 행사명</label><input id="cTitle" value="2026년 1분기 안전표어 투표"></div>
    <div class="grp"><label>③ 투표 기간</label><input id="cPeriod" value="3.18(화) ~ 3.20(목)"></div>
    <button onclick="window.print()">🖨️ 인쇄하기</button>
    <div class="hint">주소를 넣으면 QR이 자동으로 생성됩니다 · 인쇄 시 이 설정 막대는 빠집니다 · A4 세로</div>
  </div>

  <div class="page">
    <div class="eyebrow">미원상사 · 안전환경지원팀</div>
    <div class="inner">
      <div class="h1" id="pTitle">2026년 1분기 <b>안전표어 투표</b></div>
      <div class="sub">올해의 안전표어, 여러분의 한 표로 정해주세요</div>
      <div class="period-wrap"><span class="period" id="pPeriod">🗓️ 3.18(화) ~ 3.20(목)</span></div>

      <div class="qr-frame"><div id="qr"></div></div>
      <div class="scan"><span class="cam">📷 휴대폰 카메라</span>로 QR을 비추세요</div>

      <div class="steps">
        <div class="step"><div class="badge">1</div><div class="t">QR 코드 스캔</div></div>
        <div class="step"><div class="badge">2</div><div class="t">이름 입력 후<br>표어 1개 선택</div></div>
        <div class="step"><div class="badge">3</div><div class="t">제출하면<br>참여 완료!</div></div>
      </div>

      <div class="note">✅ 1인 1표 · 결과는 식당·로비 화면에서 실시간으로 확인하세요</div>
    </div>
    <div class="foot"><span>주관 · 안전환경지원팀</span><span>문의 · 내선 안전환경지원팀</span></div>
  </div>

<script>
  const qrBox=document.getElementById("qr");
  let qr=new QRCode(qrBox,{text:"https://example.github.io/vote-qr.html",width:520,height:520,
    colorDark:"#1A2230",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  function upd(){
    const url=document.getElementById("cUrl").value.trim()||"https://example.github.io/vote-qr.html";
    qrBox.innerHTML=""; qr=new QRCode(qrBox,{text:url,width:520,height:520,colorDark:"#1A2230",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
    document.getElementById("pTitle").innerHTML=(document.getElementById("cTitle").value||"안전표어 투표").replace(/(안전표어 투표)/,"<b>$1</b>");
    document.getElementById("pPeriod").textContent="🗓️ "+(document.getElementById("cPeriod").value||"");
  }
  document.getElementById("cUrl").addEventListener("input",upd);
  document.getElementById("cTitle").addEventListener("input",upd);
  document.getElementById("cPeriod").addEventListener("input",upd);
  upd();
</script>
</body>
</html>
